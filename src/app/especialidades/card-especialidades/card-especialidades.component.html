<div class="cards-grid">
  <article class="card" *ngFor="let cardValues of card">
    <img [src]="cardValues.urlimg" [alt]="cardValues.name">
    <h3>{{ cardValues.name }}</h3>
    <p>{{ cardValues.description }}</p>
    <a class="card__action" href="#agendar">Agendar consulta</a>
  </article>
</div>
