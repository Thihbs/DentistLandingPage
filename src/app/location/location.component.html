<section class="location-wrap" id="localizacao">
  <div class="location__content">
    <img src="assets/vazYVBPLGeRRuebFBd7wmi.png" alt="Logo da clínica">
    <p class="location__eyebrow">Visite nossa clínica</p>
    <h2>Estrutura completa para atender você com conforto e precisão.</h2>
    <p>
      Estamos na Granja Viana com fácil acesso, ambiente acolhedor e atendimento próximo para você e sua família.
    </p>
    <app-button-component></app-button-component>
  </div>

  <div class="location__map">
    <google-map
      width="100%"
      height="420px"
      [zoom]="zoom"
      [center]="center"
      [options]="options"
      (mapClick)="mapClick($event)"
    >
      <map-marker
        #markerElem="mapMarker"
        *ngFor="let marker of markers"
        [position]="marker.position"
        [label]="marker.label"
        [title]="marker.title"
        [options]="marker.options"
        (mapClick)="openInfo(markerElem, marker.info)"
      ></map-marker>
      <map-info-window>
        <div [innerHTML]="infoContent"></div>
      </map-info-window>
    </google-map>
  </div>
</section>
